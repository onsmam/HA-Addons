name: "Teslamate Grafana"
description: "Grafana dashboards voor Teslamate. Vereist de Teslamate Database addon."
version: "11.2.0"
slug: "teslamate_grafana"
init: false
homeassistant_api: false
auth_api: false
url: "https://github.com/onsmam/HA-Addons"

arch:
  - aarch64
  - amd64

startup: services
boot: auto
host_network: true

ports:
  3001/tcp: 3001

ports_description:
  3001/tcp: "Grafana web interface"

map:
  - share:rw

options:
  db_password: "teslamate"
  admin_password: "admin"
  teslamate_version: "v4.2.0"

schema:
  db_password: str
  admin_password: str
  teslamate_version: str
